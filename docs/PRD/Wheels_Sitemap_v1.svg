      .legend { fill: #5A6B73; font-size: 13px; }
      .title { fill: #0F3D5C; font-weight: 700; font-size: 26px; }
      .subtitle { fill: #5A6B73; font-size: 15px; }
      line { stroke: #5A6B73; stroke-width: 1.5; }
      .conn-bold { stroke: #C8102E; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
