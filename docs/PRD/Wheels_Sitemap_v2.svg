      .subtitle    { fill: #737373; font-size: 15px; }
      .descoped    { fill: #FAFAFA; stroke: #D4D4D4; stroke-dasharray: 4 3; }
      .descoped-text { fill: #A3A3A3; font-size: 13px; font-family: 'Geist Mono', 'Courier New', monospace; }
      .descoped-tag { fill: #A3A3A3; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
      .redirect    { fill: #EFEFEF; stroke: #C8102E; stroke-width: 1; stroke-dasharray: 4 3; }
      .redirect-text { fill: #C8102E; font-size: 12px; font-family: 'Geist Mono', 'Courier New', monospace; }
