      /* INK & SIGNAL palette */
      .root        { fill: #000000; stroke: #000000; }
      .root-text   { fill: #FFFFFF; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; text-transform: uppercase; }
      .l1          { fill: #FFFFFF; stroke: #000000; stroke-width: 2; }
      .l1-text     { fill: #0A0A0A; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em; }
      .l2          { fill: #F5F5F5; stroke: #E5E5E5; stroke-width: 1; }
      .l2-text     { fill: #0A0A0A; font-size: 13px; font-family: 'Geist Mono', 'Courier New', monospace; }
      .l2-note     { fill: #737373; font-size: 11px; font-style: italic; }
      .booking     { fill: #C8102E; stroke: #C8102E; }
      .booking-text{ fill: #FFFFFF; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em; }
      .step        { fill: #FFF0F2; stroke: #C8102E; stroke-width: 1.5; }
      .step-text   { fill: #C8102E; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; }
      .gated       { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.5; }
      .gated-text  { fill: #B45309; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
      .meta        { fill: #EFEFEF; stroke: #D4D4D4; }
      .meta-text   { fill: #525252; font-size: 12px; font-family: 'Geist Mono', 'Courier New', monospace; }
