  <line x1="195" y1="630" x2="195" y2="660" />
  <line x1="390" y1="630" x2="390" y2="660" />
  <line x1="575" y1="630" x2="575" y2="660" />
  <line x1="765" y1="630" x2="765" y2="660" />
